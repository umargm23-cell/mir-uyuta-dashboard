name: Deploy official source reader

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/official-source/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-official-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: npecgcxncwmgbqgqregh
    steps:
      - name: Explain missing deployment authorization
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' }}
        run: echo 'Deployment skipped. Set SUPABASE_ACCESS_TOKEN in GitHub Actions secrets to enable automatic deployment.'
      - uses: actions/checkout@v4
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
      - uses: supabase/setup-cli@v1
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        with:
          version: latest
      - name: Deploy authenticated Edge Function
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy official-source --project-ref "$SUPABASE_PROJECT_REF" --use-api